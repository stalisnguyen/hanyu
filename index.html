async function drawSteps(ch,box,chEl,nEl,onClick){
  if(!box)return; if(chEl)chEl.textContent=ch;
  const d=await strokeData(ch);
  if(!d){box.innerHTML='<p class="note">Chưa có dữ liệu nét cho chữ này.</p>';if(nEl)nEl.textContent='';return;}
  const n=d.strokes.length; if(nEl)nEl.textContent=n+' nét';
  const num=(i)=>{const m=d.medians[i]&&d.medians[i][0];return m?`<circle cx="${m[0]}" cy="${m[1]}" r="62" fill="var(--bad)"/><text x="${m[0]}" y="${m[1]}" font-size="80" font-family="Noto Sans,sans-serif" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central" transform="scale(1,-1) translate(0,${-2*m[1]})">${i+1}</text>`:'';};
  box.innerHTML=d.strokes.map((_,k)=>`<button class="step" title="Bước ${k+1}"><svg viewBox="0 0 1024 1024"><g transform="translate(0,900) scale(1,-1)">${d.strokes.map((sp,i)=>`<path d="${sp}" fill="${i<k?'var(--ink)':i===k?'var(--bad)':'var(--line)'}"/>`).join('')}${num(k)}</g></svg><span class="num">${k+1}</span></button>`).join('');
  $$('.step',box).forEach(b=>b.onclick=onClick);
}

/* ================= shared skill helpers ================= */
const PUNCT=/[\s，。？！、,.?!；;：:“”"'‘’（）()《》…—\-]/g;
function segment(text){
  try{const sg=new Intl.Segmenter('zh',{granularity:'word'});return [...sg.segment(text)].map(x=>x.segment);}catch(e){}
  const out=[];let buf='';for(const c of text){if(PUNCT.test(c)){PUNCT.lastIndex=0;if(buf)out.push(buf);buf='';out.push(c);}else{buf+=c;if(buf.length===2){out.push(buf);buf='';}}}if(buf)out.push(buf);return out;
}
const tonelessPy=t=>{try{return window.pinyinPro.pinyin(t,{toneType:'none',type:'array'}).map(x=>x.replace(/ü/g,'v'));}catch(e){return [...t];}};
function lcsMatch(a,b,eq){ // returns boolean[] over a
  const n=a.length,m=b.length,dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=eq(a[i],b[j])?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ok=new Array(n).fill(false);let i=0,j=0;while(i<n&&j<m){if(eq(a[i],b[j])){ok[i]=true;i++;j++;}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++;}
  return ok;
}
// compare learner input (hanzi or pinyin) with target sentence; returns {ok:boolean[], chars, pct}
function compareZh(target,input){
  const chars=[...target.replace(PUNCT,'')];
  const inp=input.replace(PUNCT,'');
  const tp=tonelessPy(chars.join(''));
  let ok;
  if([...inp].some(isHan)){const ip=tonelessPy(inp);const ic=[...inp];
    ok=lcsMatch(chars.map((c,i)=>[c,tp[i]]),ic.map((c,i)=>[c,ip[i]]),(x,y)=>x[0]===y[0]||x[1]===y[1]);}
  else{const syl=stripTone(input).replace(/[^a-zv\s']/g,' ').trim();
    const joined=syl.replace(/[\s']/g,'');ok=new Array(chars.length).fill(false);let pos=0;
    tp.forEach((p,i)=>{const k=joined.indexOf(p,pos);if(k>=0&&k-pos<=3){ok[i]=true;pos=k+p.length;}});}
  return {ok,chars,pct:chars.length?Math.round(ok.filter(Boolean).length/chars.length*100):0};
}
const markHTML=r=>r.chars.map((c,i)=>`<span class="${r.ok[i]?'mk-ok':'mk-bad'}">${esc(c)}</span>`).join('');
function skillLv(){return Math.max(...P.settings.lv);}
function sentencePool(lv){const ws=W.filter(w=>w.lv<=lv&&w.ex&&w.ex.length>=5);const cur=ws.filter(w=>w.lv===lv);return cur.length>20?cur:ws;}
function subTabs(id,items,cur,onPick){
  setTimeout(()=>$$('#'+id+' [data-st]').forEach(b=>b.onclick=()=>onPick(b.dataset.st)));
  return `<div class="row" id="${id}">${items.map(([k,t])=>`<button class="chip" data-st="${k}" aria-pressed="${k===cur}">${t}</button>`).join('')}</div>`;
}

  }else{

      $$('[data-k]',b).forEach((y,k)=>{y.disabled=true;if(it.o[k]===it.w)y.classList.add('right');else if(k===it.ans)y.classList.add('wrong');});

      $('#lNext').onclick=()=>{LS.i++;drawListen();};});
  }

function orderItem(sentence,vi,extra){
  const end=(sentence.match(/[。？！]$/)||[''])[0];
  let pieces=segment(sentence.replace(/[。？！]$/,'')).filter(x=>x.trim());
  // merge punctuation into previous piece and tiny pieces to keep 3-7 chunks
  const m=[];pieces.forEach(p=>{if(PUNCT.test(p)&&m.length){PUNCT.lastIndex=0;m[m.length-1]+=p;}else{PUNCT.lastIndex=0;m.push(p);}});
  while(m.length>7){let k=0,best=1e9;for(let i=0;i<m.length-1;i++){const l=m[i].length+m[i+1].length;if(l<best){best=l;k=i;}}m.splice(k,2,m[k]+m[k+1]);}
  let sh=shuffle(m);let tries=0;while(sh.join('')===m.join('')&&m.length>1&&tries++<5)sh=shuffle(m);
  return {k:'order',pieces:sh,a:sentence,hint:vi+(extra?' - '+extra:''),w:'Câu đúng: '+sentence+(end?'':'')};
}

function contour(t){

  else{const P2=t.pts.map(p=>[x0+8+p[0]*(x1-x0-16),y(p[1])]);const d=P2.length===3?`M${P2[0][0]} ${P2[0][1]} Q${P2[1][0]} ${P2[1][1]+18} ${P2[2][0]} ${P2[2][1]}`:`M${P2[0][0]} ${P2[0][1]} L${P2[1][0]} ${P2[1][1]}`;m=`<path d="${d}" stroke="var(--t${t.n})" stroke-width="4" fill="none" stroke-linecap="round"/>`;}

const MC={body:'#2FAE84',dark:'#1B8564',snout:'#7FD8B5',belly:'#FFF0C2',belly2:'#F2DC9A',horn:'#FFC23D',horn2:'#E59A12',eye:'#17211C',cheek:'#FF98A0',hat:'#20262B',red:'#C8372F',gold:'#F5B82E'};
function mcHat(r){

  if(r===1)return `<path d="M58 52c10-22 74-22 84 0-8 6-76 6-84 0z" fill="${MC.hat}"/><path d="M62 49c12-8 64-8 76 0" stroke="#3B444B" stroke-width="3" fill="none"/>`; // khăn đóng
  const h=r<=4?[0,0,10,16,22][r]:22;
  let s=`<path d="M64 50c6-${8+h} 66-${8+h} 72 0z" fill="${MC.hat}"/><rect x="60" y="46" width="80" height="9" rx="4.5" fill="${MC.hat}"/>`;
  if(r>=3)s+=`<rect x="92" y="${36-h}" width="16" height="7" rx="3" fill="${MC.gold}"/>`;
  if(r===5)s+=`<circle cx="134" cy="44" r="7" fill="${MC.red}"/><circle cx="134" cy="44" r="3" fill="${MC.gold}"/><path d="M127 49l-6 6" stroke="${MC.body}" stroke-width="3"/>`;
  if(r>=6)s+=`<path d="M60 50c-14-2-26-8-30-14 10 0 22 4 32 8z" fill="${MC.hat}"/><path d="M140 50c14-2 26-8 30-14-10 0-22 4-32 8z" fill="${MC.hat}"/>`;

function mcRankIdx(){try{const xp=plXPTotal();let i=0;PL_RANKS.forEach((r,k)=>{if(xp>=r[0])i=k;});return i;}catch(e){return 0;}}

/* ================= PLAN: daily plan, XP, ranks, placement, mistakes, culture, decomposition, reports ================= */
const PL_W={review:1,new:3,listen:2,speak:3,read:20,write:6,grammar:8,test:4,game:1,culture:5};
const PL_RANKS=[[0,'童生','Đồng sinh'],[300,'秀才','Tú tài'],[1000,'举人','Cử nhân'],[2500,'贡士','Cống sĩ'],[5000,'进士','Tiến sĩ'],[9000,'探花','Thám hoa'],[15000,'榜眼','Bảng nhãn'],[25000,'状元','Trạng nguyên']];
function plDay(k){P.day=P.day||{};k=k||ymd(Date.now());return P.day[k]=P.day[k]||{xp:0};}
function plXPTotal(){return Object.values(P.day||{}).reduce((a,d)=>a+(d.xp||0),0);}
function plRank(xp){let r=PL_RANKS[0],nx=null;for(let i=0;i<PL_RANKS.length;i++){if(xp>=PL_RANKS[i][0]){r=PL_RANKS[i];nx=PL_RANKS[i+1]||null;}}return {r,nx};}
function award(kind,n){
  n=n||1; const d=plDay(); d[kind]=(d[kind]||0)+n; const before=plXPTotal();
  d.xp=(d.xp||0)+Math.round((PL_W[kind]||1)*n);
  const k=ymd(Date.now()); P.hist[k]=(P.hist[k]||0)+n; touch('main');
  const a=plRank(before).r, b=plRank(plXPTotal()).r;
  const gain=Math.round((PL_W[kind]||1)*n); window.__xpFly&&window.__xpFly(gain);
  if(b!==a){if(window.__rankUp)window.__rankUp(b);else toast('Lên danh hiệu mới: '+b[2]+' ('+b[1]+')',4000);}
  const goal=plGoalXP(); if(d.xp>=goal&&d.xp-gain<goal){if(window.__goalDone)setTimeout(window.__goalDone,b!==a?2500:600);else toast('Đã đạt mục tiêu hôm nay. Giỏi lắm!',3500);}
  plTick();
}
window.__award=award;
function plCfg(){P.plan=P.plan||{target:4,minutes:30,start:today(),auto:true};return P.plan;}
function plGoalXP(){return Math.round(plCfg().minutes*3.5);}
function plNewPerDay(){const m=plCfg().minutes;return m>=90?35:m>=60?25:m>=45?18:m>=30?12:8;}
function plApply(){const c=plCfg();if(!c.auto)return;P.settings.lv=LVS.filter(L=>L<=c.target);P.settings.newPerDay=plNewPerDay();}
function plTasks(){
  const c=plCfg(), d=plDay(), dow=new Date().getDay(), even=Math.floor(today()/DAY)%2===0;
  const due=dueList(studyLv()).length, nw=Math.max(0,P.settings.newPerDay-newToday());
  const t=[

    {k:'listen',t:'Nghe 10 câu',sub:'Chép chính tả hoặc nghe chọn nghĩa',done:(d.listen||0)>=10,go:'listen',n:[(d.listen||0),10]},
    {k:'speak',t:'Nói 5 câu',sub:'Nhại theo câu mẫu hoặc chấm thanh điệu',done:(d.speak||0)>=5,go:'speak',n:[(d.speak||0),5]},
    even?{k:'read',t:'Đọc 1 bài',sub:'Bài đọc theo cấp, làm câu hỏi cuối bài',done:(d.read||0)>=1,go:'read'}
        :{k:'grammar',t:'Học 1 điểm ngữ pháp',sub:'Đọc, làm câu luyện tập, bấm "Đánh dấu đã nắm"',done:(d.grammar||0)>=1,go:'grammar'},
    {k:'culture',t:'Chuyện văn hóa hôm nay',sub:'Đọc và trả lời câu hỏi nhỏ',done:(d.culture||0)>=1,go:'culture'},
  ];

  if(dow===0)t.push({k:'test',t:'Thi thử cuối tuần',sub:'Một đề HSK '+c.target+' để đo tiến độ',done:(d.test||0)>=1,go:'test'});

function plProjection(){

    ${Object.keys(P.srs).length<20&&!P.placed?`<div class="vn">Bạn từng học tiếng Trung. Làm <button class="lnk" id="plPlace">bài xếp lớp 10 phút</button> để bỏ qua những từ còn nhớ, tiết kiệm vài trăm thẻ.</div>`:''}
  </div>`;
}

function plMistList(){P.mist=P.mist||{};return Object.entries(P.mist).filter(([k,v])=>!v.ok||v.ok<2);}

function lpSplit(text){return text.split(/(?<=[。！？!?；])/).map(x=>x.trim()).filter(Boolean);}

  const draw=()=>{
    box.innerHTML=`<div class="spread"><select id="lpSel">${list.map(x=>`<option value="${x.id}" ${x.id===r.id?'selected':''}>${esc(x.title)} - ${esc(x.tvi)}</option>`).join('')}</select>

      <div class="row"><button class="btn sm" id="lpRead">Làm câu hỏi bài này</button></div>`;
    $('#lpSel').onchange=e=>{LS.pid=e.target.value;stopSay();lpPassage(box);};
    $$('[data-i]',box).forEach(b=>b.onclick=()=>say(sents[+b.dataset.i]));
    $$('[data-show]',box).forEach(b=>b.onclick=()=>{st.shown.add(+b.dataset.show);draw();});
    $('#lpShow').onclick=()=>{sents.forEach((_,i)=>st.shown.add(i));draw();};

      if(st.playing)window.__award&&window.__award('listen',5);st.playing=false;draw();};
  };
  draw();
}

function gmShort(vi){const s=String(vi).split(';')[0].trim();if(s.length<=44)return s;const c=s.slice(0,42),sp=c.lastIndexOf(' ');return (sp>24?c.slice(0,sp):c).replace(/[\s,:(]+$/,'')+'...';}

function gmRace(p,ms){return Promise.race([p,new Promise(r=>setTimeout(()=>r(true),ms))]);}
function gmClock(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

/* three wrong options with different short meanings, preferring the same word length */
function gmOptions(w,pool){
  const mine=gmShort(w.vi),len=[...w.h].length,seen=new Set([mine]),out=[];
  const cand=shuffle(pool).slice(0,60).sort((a,b)=>Math.abs([...a.h].length-len)-Math.abs([...b.h].length-len));
  for(const x of cand){if(out.length>=3)break;const s=gmShort(x.vi);if(x.h===w.h||seen.has(s))continue;seen.add(s);out.push(x);}
  return shuffle([w,...out]);
}

let GM_AC=null;
function gmSfx(kind){
  if(gmData().mute)return;
  try{
    GM_AC=GM_AC||new (window.AudioContext||window.webkitAudioContext)();const ac=GM_AC;if(ac.state==='suspended')ac.resume();
    const seq={ok:[[660,.07],[990,.1]],combo:[[660,.06],[880,.06],[1320,.14]],bad:[[196,.2]],tick:[[1400,.03]],pop:[[520,.05],[820,.08]],end:[[523,.1],[659,.1],[784,.22]]}[kind]||[];
    let t=ac.currentTime;
    seq.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=kind==='bad'?'sawtooth':'triangle';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(kind==='bad'?0.07:0.12,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+0.03);t+=d*0.85;});
  }catch(e){}
}

/* ---------- 1. Tốc độ 60 giây ---------- */
function gmSpeed(body,game){
  const pool=gmPool(),hud=$('#gmHud'),DUR=60;
  const st={score:0,combo:0,maxCombo:0,right:0,wrong:0,missed:[],left:DUR,lock:true,cur:null,opts:[]};
  const mult=c=>Math.min(5,1+Math.floor(c/3));
  body.innerHTML=`<div class="gm-tbar" id="gmTb"><i id="gmT"></i></div>
    <div class="gm-sp"><div class="gm-combo" id="gmCombo"></div><div class="gm-word han" id="gmW"></div><div class="gm-fxh" id="gmFx"></div></div>
    <div class="gm-opts" id="gmO"></div>`;
  const drawHud=()=>{hud.innerHTML=`<span class="gm-pts num">${st.score}</span><span class="timer num ${st.left<=10?'low':''}">${Math.ceil(st.left)}s</span>`;};
  const drawCombo=()=>{const m=mult(st.combo);$('#gmCombo').innerHTML=st.combo>=2?`<span class="gm-cb ${m>1?'hot':''}">Chuỗi ${st.combo}${m>1?' - nhân '+m:''}</span>`:'';};
  let order=shuffle(pool),oi=0;
  function next(){
    if(oi>=order.length){order=shuffle(pool);oi=0;}
    st.cur=order[oi++];st.opts=gmOptions(st.cur,pool);st.lock=false;
    const n=[...st.cur.h].length,w=$('#gmW');w.innerHTML=hanHTML(st.cur);w.style.setProperty('--n',n);
    $('#gmO').innerHTML=st.opts.map((o,k)=>`<button class="gm-opt" data-k="${k}"><span class="gm-k num">${k+1}</span><span>${esc(gmShort(o.vi))}</span></button>`).join('');
    $$('#gmO [data-k]').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  }
  function answer(k){
    if(st.lock||!st.opts[k])return;st.lock=true;
    const btns=$$('#gmO .gm-opt'),ri=st.opts.indexOf(st.cur);btns[ri].classList.add('right');
    if(k===ri){st.combo++;st.right++;st.maxCombo=Math.max(st.maxCombo,st.combo);const pts=10*mult(st.combo);st.score+=pts;
      gmSfx(st.combo>=3&&st.combo%3===0?'combo':'ok');gmFloat($('#gmFx'),'+'+pts,'ok');gmLater(next,200);}
    else{btns[k].classList.add('wrong');st.combo=0;st.wrong++;st.missed.push(st.cur);gmSfx('bad');gmLater(next,850);}
    drawCombo();drawHud();
  }
  const end=performance.now()+DUR*1000;let lastSec=DUR;
  gmEvery(()=>{
    st.left=Math.max(0,(end-performance.now())/1000);
    $('#gmT').style.width=(st.left/DUR*100)+'%';$('#gmTb').classList.toggle('low',st.left<=10);
    const s=Math.ceil(st.left);if(s!==lastSec){lastSec=s;drawHud();if(s<=5&&s>0)gmSfx('tick');}
    if(st.left<=0)gmEnd(game,st.score,st.missed,[['Đúng',st.right],['Sai',st.wrong],['Chuỗi dài nhất',st.maxCombo]]);
  },100);
  GM.key=e=>{if(/^[1-4]$/.test(e.key)){e.preventDefault();answer(+e.key-1);}};
  drawHud();drawCombo();next();
}

/* ---------- 2. Ghép cặp ---------- */
function gmMatch(body,game){
  const pool=gmPool(),hud=$('#gmHud'),ROUNDS=3,PAIRS=6,used=new Set();
  const st={round:0,left:0,mistakes:0,score:0,missed:[],sel:null,cards:[],t0:performance.now()};
  body.innerHTML=`<div class="gm-mround" id="gmR"></div><div class="gm-grid" id="gmG"></div>`;
  const drawHud=()=>{hud.innerHTML=`<span class="small muted">Vòng ${st.round}/${ROUNDS}</span><span class="gm-pts num">${st.score}</span><span class="timer num">${gmClock((performance.now()-st.t0)/1000)}</span>`;};
  function round(){
    st.round++;st.sel=null;const ws=[],means=new Set();
    for(const w of shuffle(pool)){if(ws.length>=PAIRS)break;const s=gmShort(w.vi);if(used.has(w.h)||means.has(s))continue;means.add(s);used.add(w.h);ws.push(w);}
    st.cards=shuffle([...ws.map(w=>({w,t:'h'})),...ws.map(w=>({w,t:'v'}))]);st.left=ws.length;
    $('#gmR').innerHTML=`<span class="label">Vòng ${st.round}</span><span class="small muted">Còn ${st.left} cặp</span>`;
    $('#gmG').innerHTML=st.cards.map((c,i)=>`<button class="gm-mc ${c.t==='h'?'is-h':'is-v'}" data-i="${i}">${c.t==='h'?`<span class="han">${hanHTML(c.w)}</span>`:`<span>${esc(gmShort(c.w.vi))}</span>`}</button>`).join('');
    $$('#gmG [data-i]').forEach(b=>b.onclick=()=>tap(+b.dataset.i,b));
    drawHud();
  }
  function tap(i,btn){
    const c=st.cards[i];if(c.done)return;
    if(c.t==='h')sayWord(c.w.h);
    const btns=$$('#gmG .gm-mc');
    if(st.sel===null||st.sel===i||st.cards[st.sel].t===c.t){
      if(st.sel!==null)btns[st.sel].classList.remove('sel');
      st.sel=st.sel===i?null:i;if(st.sel!==null)btn.classList.add('sel');return;
    }
    const a=st.cards[st.sel],ba=btns[st.sel];ba.classList.remove('sel');st.sel=null;
    if(a.w===c.w){
      a.done=c.done=true;st.score+=50;st.left--;gmSfx('ok');
      [ba,btn].forEach(x=>{x.classList.add('ok');setTimeout(()=>x.classList.add('gone'),gmReduce()?120:320);});
      $('#gmR').innerHTML=`<span class="label">Vòng ${st.round}</span><span class="small muted">Còn ${st.left} cặp</span>`;
      if(!st.left){
        if(st.round<ROUNDS){gmSfx('combo');$('#gmR').innerHTML=`<span class="label">Xong vòng ${st.round}</span><span class="small muted">Chuẩn bị vòng ${st.round+1}</span>`;gmLater(round,800);}
        else gmLater(finish,450);
      }
    }else{
      st.mistakes++;st.score=Math.max(0,st.score-15);st.missed.push(a.t==='h'?a.w:c.w);gmSfx('bad');
      [ba,btn].forEach(x=>{x.classList.add('bad');setTimeout(()=>x.classList.remove('bad'),480);});
    }
    drawHud();
  }
  function finish(){
    const secs=(performance.now()-st.t0)/1000,bonus=Math.max(0,Math.round((150-secs)*3));st.score+=bonus;
    gmEnd(game,st.score,st.missed,[['Thời gian',gmClock(secs)],['Ghép sai',st.mistakes],['Thưởng tốc độ',bonus]]);
  }
  gmEvery(drawHud,250);
  round();
}

/* ---------- 3. Chữ rơi ---------- */
function gmFall(body,game){
  const mode=GM.fallMode,reduce=gmReduce(),hud=$('#gmHud');
  const pool=gmPool().filter(w=>[...w.h].length<=4&&w.p.length===[...w.h].length);
  const keyOf=w=>w.p.map(s=>stripTone(s).replace(/[^a-zv]/g,'')).join('');
  const st={score:0,lives:3,combo:0,killed:0,missed:[],items:[],t:0,spawnIn:0,last:0,lowest:null,opts:[]};
  body.innerHTML=`<div class="gm-field" id="gmF"><div class="gm-floor" id="gmFloor"></div></div>
    ${mode==='py'?`<form class="gm-type" id="gmForm" autocomplete="off"><input id="gmIn" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="Pinyin không dấu, vd: xuexi" aria-label="Pinyin"><button class="btn primary" type="submit">Bắn</button></form>`
      :`<div class="gm-opts gm-opts-fall" id="gmO"></div>`}`;
  const F=$('#gmF');
  const drawHud=()=>{hud.innerHTML=`<span class="gm-lives" aria-label="${st.lives} mạng">${[0,1,2].map(i=>`<i class="${i<st.lives?'on':''}">♥</i>`).join('')}</span><span class="gm-pts num">${st.score}</span>`;};
  const label=w=>`${w.p.join(' ')} - ${gmShort(w.vi)}`;
  function spawn(){
    const onScreen=new Set(st.items.map(it=>it.w.h)),keys=new Set(st.items.map(it=>it.key));
    let w=null;for(let k=0;k<20;k++){const c=pick(pool);if(!onScreen.has(c.h)&&!keys.has(keyOf(c))){w=c;break;}}
    if(!w)return;
    const el=document.createElement('div');el.className='gm-drop han';el.innerHTML=hanHTML(w);F.appendChild(el);
    const ew=el.offsetWidth,eh=el.offsetHeight,fw=F.clientWidth;
    const it={w,el,key:keyOf(w),x:6+Math.random()*Math.max(0,fw-ew-12),y:-eh,h:eh};
    el.style.transform=`translate(${it.x}px,${it.y}px)`;st.items.push(it);
  }
  function remove(it){st.items=st.items.filter(x=>x!==it);}
  function kill(it){
    remove(it);st.combo++;st.killed++;
    const pts=10+5*([...it.w.h].length-1)+Math.min(20,(st.combo-1)*2);st.score+=pts;
    gmSfx(st.combo%5===0?'combo':'pop');
    gmFloat(F,'+'+pts+'  '+label(it.w),'ok',it.x,Math.max(0,it.y));
    it.el.style.setProperty('--t',`translate(${it.x}px,${it.y}px)`);it.el.classList.add('boom');setTimeout(()=>it.el.remove(),reduce?60:260);drawHud();
  }
  function lose(it){
    remove(it);st.lives--;st.combo=0;st.missed.push(it.w);gmSfx('bad');
    gmFloat(F,label(it.w),'bad',it.x,F.clientHeight-70);
    it.el.remove();$('#gmFloor').classList.remove('hit');void F.offsetWidth;$('#gmFloor').classList.add('hit');drawHud();
    if(st.lives<=0)gmEnd(game,st.score,st.missed,[['Phá được',st.killed],['Thời gian',gmClock(st.t)],['Chế độ',mode==='py'?'Pinyin':'Nghĩa']]);
  }
  function drawOpts(){
    const box=$('#gmO');if(!box)return;const it=st.lowest;
    if(!it){box.innerHTML='<p class="note">Chờ chữ rơi xuống...</p>';st.opts=[];return;}
    st.opts=gmOptions(it.w,pool);
    box.innerHTML=st.opts.map((o,k)=>`<button class="gm-opt" data-k="${k}"><span class="gm-k num">${k+1}</span><span>${esc(gmShort(o.vi))}</span></button>`).join('');
    $$('[data-k]',box).forEach(b=>b.onclick=()=>choose(+b.dataset.k));
  }
  function choose(k){
    const it=st.lowest,o=st.opts[k];if(!it||!o)return;
    if(o===it.w){kill(it);return;}
    const b=$$('#gmO .gm-opt')[k];if(b){b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),400);}
    st.combo=0;st.score=Math.max(0,st.score-5);if(!st.missed.includes(it.w))st.missed.push(it.w);gmSfx('bad');drawHud();
  }
  function shoot(){
    const inp=$('#gmIn');const v=stripTone(inp.value).replace(/[^a-z]/g,'');if(!v)return;
    const hits=st.items.filter(it=>it.key===v||it.key.replace(/v/g,'u')===v).sort((a,b)=>b.y-a.y);
    inp.value='';st.items.forEach(it=>it.el.classList.remove('hit'));
    if(hits.length)kill(hits[0]);
    else{st.combo=0;gmSfx('bad');inp.classList.remove('gm-shake');void inp.offsetWidth;inp.classList.add('gm-shake');}
  }
  if(mode==='py'){
    const inp=$('#gmIn');
    $('#gmForm').onsubmit=e=>{e.preventDefault();shoot();inp.focus();};
    inp.oninput=()=>{const v=stripTone(inp.value).replace(/[^a-z]/g,'');st.items.forEach(it=>it.el.classList.toggle('hit',!!v&&(it.key.startsWith(v)||it.key.replace(/v/g,'u').startsWith(v))));};
    setTimeout(()=>inp.focus(),30);
  }else GM.key=e=>{if(/^[1-4]$/.test(e.key)){e.preventDefault();choose(+e.key-1);}};
  const slow=reduce?0.6:1,slowMode=mode==='vi'?0.85:1;
  function loop(ts){
    if(!gmAlive()){gmClear();return;}
    const dt=st.last?Math.min(0.05,(ts-st.last)/1000):0;st.last=ts;st.t+=dt;
    const H=F.clientHeight,scale=H/420;
    const speed=Math.min(150,30+st.t*1.2)*scale*slow*slowMode;
    st.spawnIn-=dt;
    if(st.spawnIn<=0&&st.items.length<7){spawn();st.spawnIn=Math.max(mode==='vi'?1.7:1.0,(mode==='vi'?3.6:3.0)-st.t*0.035)/slow;}
    for(const it of st.items.slice()){
      it.y+=speed*dt;it.el.style.transform=`translate(${it.x}px,${it.y}px)`;
      if(it.y+it.h>=H-6){lose(it);if(st.lives<=0)return;}
    }
    if(mode==='vi'){
      const low=st.items.reduce((m,it)=>!m||it.y>m.y?it:m,null);
      if(low!==st.lowest){if(st.lowest)st.lowest.el.classList.remove('target');st.lowest=low;if(low)low.el.classList.add('target');drawOpts();}
    }
    GM.raf=requestAnimationFrame(loop);
  }
  drawHud();if(mode==='vi')drawOpts();
  GM.raf=requestAnimationFrame(loop);
}

/* ---------- 4. Bắn thanh điệu ---------- */
function gmTone(body,game){
  const hud=$('#gmHud'),entries=[],seenSyl=new Set();
  for(const w of shuffle(gmPool())){const ch=[...w.h];if(ch.length!==w.p.length)continue;
    w.p.forEach((p,i)=>{const t=toneOf(p);if(t===5)return;const syl=stripTone(p).replace(/[^a-zv]/g,'')+t;if(seenSyl.has(syl))return;seenSyl.add(syl);entries.push({syl,mark:p.toLowerCase(),tone:t,w,ch:ch[i]});});}
  const st={score:0,lives:3,streak:0,best:0,right:0,n:0,missed:[],cur:null,phase:'load',tm:0,tts:false};
  body.innerHTML=`<div class="gm-tone">
    <div class="gm-tq"><button class="gm-play" id="gmPlay" aria-label="Nghe lại">${SPK}</button><span class="small muted" id="gmTs">Đang phát...</span></div>
    <div class="gm-tbar" id="gmTb"><i id="gmT"></i></div>
    <div class="gm-reveal" id="gmRv"></div>
    <div class="gm-tbtns">${[1,2,3,4].map(n=>`<button class="gm-tb" data-t="${n}"><span class="py t${n}">${GM_TONE_MARK[n-1]}</span><span class="small muted">Thanh ${n} <span class="kbd">${n}</span></span></button>`).join('')}</div></div>`;
  const drawHud=()=>{hud.innerHTML=`<span class="gm-lives" aria-label="${st.lives} mạng">${[0,1,2].map(i=>`<i class="${i<st.lives?'on':''}">♥</i>`).join('')}</span>${st.streak>=2?`<span class="gm-cb hot">Chuỗi ${st.streak}</span>`:''}<span class="gm-pts num">${st.score}</span>`;};
  const play=e=>st.tts?gmRace(say(e.ch),2500):gmRace(saySyl(e.syl),3000);
  async function nextQ(){
    st.phase='load';st.cur=null;$('#gmRv').innerHTML='';$('#gmTs').textContent='Đang phát...';$('#gmT').style.width='100%';
    $$('.gm-tb').forEach(b=>{b.classList.remove('right','wrong');b.disabled=false;});
    let e=null;
    for(let k=0;k<8&&!e;k++){const c=pick(entries);if(await play(c))e=c;if(!gmAlive())return;}
    if(!e){st.tts=true;e=pick(entries);toast('Không phát được bản thu âm tiết, tạm dùng giọng máy.');await play(e);if(!gmAlive())return;}
    st.cur=e;st.phase='ask';$('#gmTs').textContent='Thanh mấy?';
    const limit=Math.max(2.5,5.5-st.n*0.08)*(gmReduce()?1.3:1),t0=performance.now();
    st.tm=gmEvery(()=>{const left=limit-(performance.now()-t0)/1000;$('#gmT').style.width=Math.max(0,left/limit*100)+'%';$('#gmTb').classList.toggle('low',left<limit*0.3);if(left<=0)answer(0);},50);
  }
  function answer(t){
    if(st.phase!=='ask')return;st.phase='show';clearInterval(st.tm);st.n++;
    const c=st.cur,ok=t===c.tone,btns=$$('.gm-tb');
    btns.forEach(b=>b.disabled=true);btns[c.tone-1].classList.add('right');if(t&&!ok)btns[t-1].classList.add('wrong');
    if(ok){st.streak++;st.right++;st.best=Math.max(st.best,st.streak);const pts=10+Math.min(20,(st.streak-1)*2);st.score+=pts;gmSfx(st.streak%5===0?'combo':'ok');}
    else{st.lives--;st.streak=0;st.missed.push(c.w);gmSfx('bad');}
    $('#gmTs').textContent=ok?'Đúng':(t?'Chưa đúng':'Hết giờ');
    $('#gmRv').innerHTML=`<span class="py gm-syl t${c.tone}">${esc(c.mark)}</span><span class="small muted">thanh ${c.tone}, trong từ</span>
      <button class="gm-rw" data-say="${esc(c.w.h)}"><span class="han">${hanHTML(c.w)}</span><span class="py small">${pyHTML(c.w)}</span><span class="small">${esc(gmShort(c.w.vi))}</span></button>`;
    drawHud();
    if(st.lives<=0)gmLater(()=>gmEnd(game,st.score,st.missed,[['Đúng',st.right+'/'+st.n],['Chuỗi dài nhất',st.best]]),1500);
    else gmLater(nextQ,ok?1100:2000);
  }
  $$('.gm-tb').forEach(b=>b.onclick=()=>answer(+b.dataset.t));
  $('#gmPlay').onclick=()=>{if(st.cur)play(st.cur);};
  GM.key=e=>{if(/^[1-4]$/.test(e.key)){e.preventDefault();answer(+e.key);}else if((e.key==='r'||e.key==='R'||e.key===' ')&&st.cur){e.preventDefault();play(st.cur);}};
  drawHud();nextQ();
}

/* ================= PITCH TRAINER =================
   Luyện thanh điệu bằng biểu đồ: đường cao độ của bản ghi gốc và của người học vẽ chồng lên nhau.
   F0: YIN trên khung 40ms, bước 10ms, 70-450 Hz, sau khi hạ mẫu xuống ~16 kHz.
   Cao độ đổi ra nửa cung so với F0 trung vị của người nói, nên giọng nam và nữ so được với nhau. */
const PT_K=20, PT_YMAX=8;
let PT={tab:'ma',base:'ma',pair:null,q:'',item:null,ref:null,refBuf:null,refNote:'',rec:null,recBuf:null,fb:null,recording:false,micMsg:'',status:'',tok:0};
let PT_AC=null, PT_POOL=null;
function PT_ctx(){if(!PT_AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;PT_AC=new C();}return PT_AC;}

/* ---------- pitch detection ---------- */
function PT_mono(buf){
  const n=buf.length,ch=buf.numberOfChannels,x=new Float32Array(n);
  for(let c=0;c<ch;c++){const d=buf.getChannelData(c);for(let i=0;i<n;i++)x[i]+=d[i]/ch;}
  return x;
}
function PT_down(x,sr){ // box low-pass + decimate to about 16 kHz
  const f=Math.max(1,Math.round(sr/16000));if(f===1)return {x,sr};
  const m=Math.floor(x.length/f),y=new Float32Array(m);
  for(let i=0;i<m;i++){let s=0;for(let j=0;j<f;j++)s+=x[i*f+j];y[i]=s/f;}
  return {x:y,sr:sr/f};
}
function PT_yin(x,sr){ // returns [{f0,rms,clar}] per 10ms frame
  const N=Math.round(sr*0.04),hop=Math.round(sr*0.01),tMin=Math.max(2,Math.floor(sr/450)),tMax=Math.ceil(sr/70),Wn=N-tMax-1;
  const d=new Float32Array(tMax+2),out=[];
  for(let s=0;s+N<=x.length;s+=hop){
    let e=0;for(let j=0;j<N;j++)e+=x[s+j]*x[s+j];const rms=Math.sqrt(e/N);
    if(rms<1e-4){out.push({f0:0,rms,clar:0});continue;}
    let run=0;d[0]=1;
    for(let tau=1;tau<=tMax+1;tau++){let v=0;for(let j=0;j<Wn;j++){const q=x[s+j]-x[s+j+tau];v+=q*q;}run+=v;d[tau]=run>0?v*tau/run:1;}
    let best=-1;
    for(let tau=tMin;tau<=tMax;tau++){if(d[tau]<0.15){while(tau+1<=tMax&&d[tau+1]<d[tau])tau++;best=tau;break;}}
    if(best<0){let mv=9;for(let tau=tMin;tau<=tMax;tau++)if(d[tau]<mv){mv=d[tau];best=tau;}}
    let t=best;if(best>tMin&&best<tMax){const a=d[best-1],b=d[best],c=d[best+1],den=a-2*b+c;if(Math.abs(den)>1e-9)t=best+0.5*(a-c)/den;}
    out.push({f0:sr/t,rms,clar:1-d[best]});
  }
  return out;
}
const PT_med=a=>{const s=a.slice().sort((p,q)=>p-q),n=s.length;return n?(n%2?s[n>>1]:(s[n/2-1]+s[n/2])/2):0;};
function PT_track(buf){ // -> {hz:[f0|null], med}
  const {x,sr}=PT_down(PT_mono(buf),buf.sampleRate);
  const fr=PT_yin(x,sr); if(!fr.length)return {hz:[],med:0};
  const maxR=Math.max(...fr.map(f=>f.rms));
  let hz=fr.map(f=>(f.rms>Math.max(0.004,0.06*maxR)&&f.clar>0.5&&f.f0>=70&&f.f0<=450)?f.f0:null);
  // drop voiced islands shorter than 40ms
  for(let i=0;i<hz.length;){if(hz[i]==null){i++;continue;}let j=i;while(j<hz.length&&hz[j]!=null)j++;if(j-i<4)for(let k=i;k<j;k++)hz[k]=null;i=j;}
  // octave errors against the global median
  let med=PT_med(hz.filter(v=>v!=null));
  if(med){hz=hz.map(v=>{if(v==null)return v;let r=v/med;if(r>1.8&&v/2>=70)v/=2;else if(r<0.56&&v*2<=450)v*=2;r=v/med;return (r>2.2||r<0.45)?null:v;});}
  // 5-point median smoothing inside voiced runs
  const sm=hz.map((v,i)=>{if(v==null)return null;const w=[];for(let k=i-2;k<=i+2;k++)if(hz[k]!=null)w.push(hz[k]);return PT_med(w);});
  med=PT_med(sm.filter(v=>v!=null));
  return {hz:sm,med,rms:fr.map(f=>f.rms),maxR};
}
function PT_analyze(buf,nSyl){ // -> {st:[semitone|null] over the speech region, segs:[[a,b]], med, voiced}
  const {hz,med,rms,maxR}=PT_track(buf);
  if(!med)return {st:[],segs:[],med:0,voiced:0};
  // voiced runs, grouped into clusters split by gaps > 200ms; keep the strongest cluster
  const runs=[];for(let i=0;i<hz.length;){if(hz[i]==null){i++;continue;}let j=i;while(j<hz.length&&hz[j]!=null)j++;runs.push([i,j-1]);i=j;}
  const cl=[];for(const r of runs){const c=cl[cl.length-1];if(c&&r[0]-c.b<=20){c.b=r[1];c.n+=r[1]-r[0]+1;}else cl.push({a:r[0],b:r[1],n:r[1]-r[0]+1});}
  const c=cl.sort((p,q)=>q.n-p.n)[0];
  let a=c.a,b=c.b; // trim weak onset (nasal/consonant glide) and fading offset frames
  while(b-a>10&&(hz[a]==null||rms[a]<0.3*maxR))a++;
  while(b-a>10&&(hz[b]==null||rms[b]<0.12*maxR))b--;
  const vals=hz.slice(a,b+1).filter(v=>v!=null),m2=PT_med(vals);
  const st=hz.slice(a,b+1).map(v=>v==null?null:12*Math.log2(v/m2));
  const L=st.length;let segs=[[0,L-1]];
  if(nSyl===2){
    // split at the longest unvoiced gap near the middle, else in two equal parts
    let cut=-1,glen=0;
    for(let i=0;i<L;){if(st[i]!=null){i++;continue;}let j=i;while(j<L&&st[j]==null)j++;const mid=(i+j-1)/2;if(mid>L*0.25&&mid<L*0.75&&j-i>=2&&j-i>glen){glen=j-i;cut=[i,j-1];}i=j;}
    segs=cut!==-1?[[0,cut[0]-1],[cut[1]+1,L-1]]:[[0,(L>>1)-1],[L>>1,L-1]];
  }
  return {st,segs,med:m2,voiced:vals.length};
}
function PT_resample(st,[a,b]){ // K points over the segment, interpolating across gaps
  const ix=[],vs=[];for(let i=a;i<=b;i++)if(st[i]!=null){ix.push(i);vs.push(st[i]);}
  if(ix.length<3)return null;
  const out=[];
  for(let k=0;k<PT_K;k++){const p=ix[0]+(ix[ix.length-1]-ix[0])*k/(PT_K-1);let j=0;while(j<ix.length-2&&ix[j+1]<p)j++;const t=ix[j+1]===ix[j]?0:(p-ix[j])/(ix[j+1]-ix[j]);out.push(vs[j]+(vs[j+1]-vs[j])*Math.max(0,Math.min(1,t)));}
  return out;
}

/* ---------- ideal tone shapes (Chao numbers) and sandhi ---------- */
function PT_eff(item){ // effective tones + notes
  const t=item.t.slice(),ch=[...item.h],note=[];
  if(t.length===2){
    if(ch[0]==='不'&&t[0]===4&&t[1]===4){t[0]=2;note[0]='不 trước thanh 4 đọc thành bú (thanh 2).';}
    else if(ch[0]==='一'&&t[0]===1&&t[1]!==5){if(t[1]===4){t[0]=2;note[0]='一 trước thanh 4 đọc thành yí (thanh 2).';}else{t[0]=4;note[0]='一 trước thanh 1, 2, 3 đọc thành yì (thanh 4).';}}
    else if(t[0]===3&&t[1]===3){t[0]=2;note[0]='Hai thanh 3 đi liền: âm đầu đọc thành thanh 2.';}
  }
  const half=t.map((x,i)=>x===3&&i<t.length-1);
  half.forEach((h,i)=>{if(h&&!note[i])note[i]='Thanh 3 đứng trước âm khác thường chỉ đọc nửa đầu: xuống thấp rồi dừng.';});
  return {t,half,note};
}
function PT_shape(tone,half,prev){
  if(tone===1)return [[0,5],[1,5]];
  if(tone===2)return [[0,3],[0.3,2.8],[1,5]];
  if(tone===3)return half?[[0,2],[0.7,1],[1,1]]:[[0,2],[0.5,1],[1,4]];
  if(tone===4)return [[0,5],[1,1]];
  const L={1:2,2:3,3:4,4:1}[prev]||3;return [[0,L],[1,L-0.3]];
}
function PT_ideal(item){ // per syllable K points in semitones, centred on the word mean
  const e=PT_eff(item);
  const segs=e.t.map((tone,i)=>{const s=PT_shape(tone,e.half[i],e.t[i-1]);const o=[];
    for(let k=0;k<PT_K;k++){const p=k/(PT_K-1);let j=0;while(j<s.length-2&&s[j+1][0]<p)j++;const u=(p-s[j][0])/(s[j+1][0]-s[j][0]);o.push(((s[j][1]+(s[j+1][1]-s[j][1])*Math.max(0,Math.min(1,u)))-3)*3);}return o;});
  const all=segs.flat(),m=all.reduce((p,q)=>p+q,0)/all.length;
  return {segs:segs.map(s=>s.map(v=>v-m)),eff:e};
}
function PT_align(an,nSyl){ // resampled segments + offset that puts the contour mean at 0 (ideal mean)
  if(!an||!an.st.length)return null;
  const rs=an.segs.slice(0,nSyl).map(sg=>PT_resample(an.st,sg));
  const all=rs.filter(Boolean).flat();if(!all.length)return null;
  const off=-all.reduce((p,q)=>p+q,0)/all.length;
  return {rs:rs.map(r=>r&&r.map(v=>v+off)),off};
}
const PT_rmse=(a,b)=>Math.sqrt(a.reduce((s,v,i)=>s+(v-b[i])**2,0)/a.length);
const PT_score=r=>Math.round(100*Math.max(0,Math.min(1,1-(r-1)/6)));

/* ---------- feedback ---------- */
function PT_tip(L,I,tone,orig,half,two){
  const avg=(a,i,j)=>{let s=0;for(let k=i;k<j;k++)s+=a[k];return s/(j-i);};
  const st=avg(L,0,3),en=avg(L,PT_K-3,PT_K),mn=Math.min(...L),mx=Math.max(...L),mp=L.indexOf(mn)/(PT_K-1),sl=en-st,rg=mx-mn;
  const iMn=Math.min(...I),iAvg=avg(I,0,PT_K),lAvg=avg(L,0,PT_K);
  if(tone===2&&orig===3&&st-mn>2&&mp>0.25&&mp<0.85)return 'Hai thanh 3 đi liền: âm đầu đọc thành thanh 2, đi thẳng lên, không cần xuống thấp.';
  if(tone===1){
    if(two&&lAvg<iAvg-2.5)return 'Thanh 1 chưa đủ cao so với âm còn lại. Đặt giọng cao hơn ngay từ đầu.';
    if(sl<-2)return 'Thanh 1 bị rơi xuống ở cuối. Giữ giọng cao và đều đến hết âm.';
    if(sl>2)return 'Thanh 1 đang đi lên. Bắt đầu ngay ở độ cao cuối và giữ nguyên.';
    if(rg>3)return 'Thanh 1 chưa đủ cao và đều. Giữ một nốt như khi hát.';
  }
  if(tone===2){
    if(sl<3)return 'Thanh 2 chưa lên đủ. Kéo giọng từ giữa lên cao, như khi hỏi lại "Hả?".';
    if(mx-en>2)return 'Cuối thanh 2 bị rơi xuống. Giữ hướng đi lên đến hết âm.';
    if(st-mn>2.5&&mp>0.5)return 'Thanh 2 xuống thấp quá lâu nên nghe giống thanh 3. Đi lên sớm hơn.';
  }
  if(tone===3){
    if(mn>iMn+2.5||st-mn<1.5)return 'Thanh 3 của bạn chưa xuống đủ thấp. Hạ giọng thật trầm, gần như giọng khàn.';
    if(half&&en-mn>3)return 'Thanh 3 đứng trước âm khác chỉ cần nửa đầu: xuống thấp rồi dừng, không cần lên lại.';
    if(!half&&en-mn<2)return 'Khi đọc riêng, thanh 3 lên lại ở cuối. Thêm phần đi lên nhẹ sau điểm thấp nhất.';
  }
  if(tone===4){
    if(sl>-5)return 'Thanh 4 rơi chưa đủ mạnh. Bắt đầu cao rồi rơi thẳng xuống, dứt khoát như khi ra lệnh.';
    if(two&&st<I[0]-3)return 'Thanh 4 bắt đầu hơi thấp nên nghe giống thanh huyền. Bắt đầu cao hơn.';
  }
  if(tone===5&&rg>5)return 'Thanh nhẹ đang lên xuống rõ. Đọc ngắn và nhẹ hơn, không nhấn.';
  return null;
}
const PT_GOOD=['Rất tốt, đường cao độ gần với dạng chuẩn.','Tốt lắm. Giữ cảm giác này và thử nói nhanh hơn một chút.','Chuẩn rồi. Thử thêm vài lần để nhớ cảm giác.'];
function PT_feedback(){
  const it=PT.item,n=it.t.length,id=PT_ideal(it),me=PT_align(PT.rec,n),rf=PT_align(PT.ref,n);
  if(!me)return null;
  return it.t.map((orig,i)=>{
    const L=me.rs[i],I=id.segs[i],tone=id.eff.t[i];
    const sy={py:it.py[i],tone,orig,note:id.eff.note[i]};
    if(!L)return Object.assign(sy,{score:null,tip:'Chưa bắt được giọng ở âm này. Nói to và kéo dài âm hơn một chút.'});
    const sI=PT_score(PT_rmse(L,I)),R=rf&&rf.rs[i],sR=R?PT_score(PT_rmse(L,R)):null;
    const score=sR==null?sI:Math.round((sI+sR)/2);
    let tip=PT_tip(L,I,tone,orig,id.eff.half[i],n>1);
    if(!tip)tip=score>=75?PT_GOOD[(i+score)%PT_GOOD.length]:(tone===5?'Thanh nhẹ: đọc ngắn và nhẹ, cao độ theo âm đứng trước.':'Hình dáng gần đúng. Nghe mẫu thêm một lần rồi bắt chước độ cao lúc đầu và lúc cuối.');
    return Object.assign(sy,{score,sI,sR,tip});
  });
}

/* ---------- items, pools, reference ---------- */
const PT_TM={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù',v:'ǖǘǚǜ'};
function PT_mark(base,t){ // ma+3 -> mǎ
  if(t<1||t>4)return base.replace(/v/g,'ü');
  let i=base.search(/[ae]/);if(i<0)i=base.indexOf('ou');if(i<0){for(let k=base.length-1;k>=0;k--)if('iouv'.includes(base[k])){i=k;break;}}
  if(i<0)return base;return (base.slice(0,i)+PT_TM[base[i]][t-1]+base.slice(i+1)).replace(/v/g,'ü');
}
const PT_BASES=[...new Set(DRILL.map(d=>stripTone(d[1])))];
function PT_sylItem(base,t){const d=DRILL.find(x=>stripTone(x[1])===base&&x[2]===t);return {kind:'s',h:d?d[0]:'',py:[d?d[1]:PT_mark(base,t)],t:[t],key:base+t};}
function PT_wordItem(w){return {kind:'w',h:w.h,py:w.p.slice(),t:w.p.map(toneOf),key:hexOf(w.h),lv:w.lv};}
const PT_ok=w=>w.p.length>=1&&w.p.length<=2&&[...w.h].length===w.p.length;
async function PT_pool(){
  if(PT_POOL)return PT_POOL;const idx=await audioIndex();
  PT_POOL=W.filter(w=>PT_ok(w)&&idx.w.has(hexOf(w.h)));return PT_POOL;
}
async function PT_pairWord(a,b){
  const pool=(await PT_pool()).filter(w=>w.p.length===2&&toneOf(w.p[0])===a&&toneOf(w.p[1])===b);
  const lv=P.settings.lv;let cand=pool.filter(w=>lv.includes(w.lv));
  if(!cand.length)cand=pool.filter(w=>w.lv<=Math.max(...lv)+1);if(!cand.length)cand=pool;
  if(PT.item&&cand.length>1)cand=cand.filter(w=>w.h!==PT.item.h);
  return cand.length?pick(cand):null;
}
async function PT_loadRef(){
  const it=PT.item,tok=++PT.tok;PT.ref=null;PT.refBuf=null;PT.refNote='Đang tải bản ghi mẫu...';PT_drawChart();
  try{
    const idx=await audioIndex();let url=null;
    if(it.kind==='s'&&idx.s.has(it.key))url=await audioURL('s',it.key);
    if(it.kind==='w'&&idx.w.has(it.key))url=await audioURL('w',it.key,it.lv);
    if(!url){if(tok===PT.tok){PT.refNote='Mục này chưa có bản ghi âm gốc, nên chỉ so với dạng thanh chuẩn.';PT_drawChart();}return;}
    const ab=await (await fetch(url)).arrayBuffer();const ctx=PT_ctx();
    const buf=await new Promise((res,rej)=>{const p=ctx.decodeAudioData(ab,res,rej);if(p&&p.then)p.then(res,rej);});
    if(tok!==PT.tok)return;
    PT.refBuf=buf;PT.ref=PT_analyze(buf,it.t.length);PT.refNote=PT.ref.voiced?'':'Không đọc được cao độ của bản mẫu.';
  }catch(e){if(tok===PT.tok)PT.refNote='Không tải được bản ghi mẫu.';}
  if(tok===PT.tok){if(PT.rec)PT.fb=PT_feedback();PT_drawChart();PT_drawFb();}
}
function PT_select(it){PT.item=it;PT.rec=null;PT.recBuf=null;PT.fb=null;PT.status='';PT_drawItem();PT_drawFb();PT_loadRef();}

/* ---------- recording ---------- */
function PT_micFail(e){
  const n=e&&e.name;
  if(IN_ARTIFACT||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!PT_ctx())PT.micMsg='Ở đây trình duyệt không cho dùng micro. Phần thu giọng chạy trên trang hanyu-ecru.vercel.app bằng Chrome, Edge hoặc Safari. Bạn vẫn nghe mẫu và xem đường cao độ của bản mẫu được.';
  else if(n==='NotAllowedError'||n==='SecurityError')PT.micMsg='Bạn chưa cho phép dùng micro. Bấm biểu tượng ổ khóa cạnh thanh địa chỉ, bật micro cho trang này rồi thử lại. Nếu vẫn không được, mở trang hanyu-ecru.vercel.app bằng Chrome, Edge hoặc Safari.';
  else if(n==='NotFoundError')PT.micMsg='Không tìm thấy micro trên máy. Cắm tai nghe có micro hoặc dùng điện thoại rồi thử lại.';
  else PT.micMsg='Không mở được micro. Phần thu giọng chạy trên trang hanyu-ecru.vercel.app bằng Chrome, Edge hoặc Safari.';
  PT.recording=false;PT_drawItem();
}
let PT_R=null;
async function PT_record(){
  if(PT.recording){PT_stop();return;}
  if(!PT.item)return;
  const ctx=PT_ctx();
  if(!ctx||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){PT_micFail();return;}
  stopSay();let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});}catch(e){PT_micFail(e);return;}
  try{await ctx.resume();}catch(e){}
  const src=ctx.createMediaStreamSource(stream),proc=ctx.createScriptProcessor(2048,1,1),mute=ctx.createGain();mute.gain.value=0;
  src.connect(proc);proc.connect(mute);mute.connect(ctx.destination);
  const sr=ctx.sampleRate,blk=2048/sr;
  PT_R={stream,src,proc,mute,chunks:[],t:0,floor:[],speech:0,sil:0,heard:false,sr};
  proc.onaudioprocess=ev=>{
    const R=PT_R;if(!R||R.proc!==proc)return;
    const x=ev.inputBuffer.getChannelData(0);R.chunks.push(new Float32Array(x));R.t+=blk;
    let e=0;for(let i=0;i<x.length;i++)e+=x[i]*x[i];const rms=Math.sqrt(e/x.length);
    if(R.t<0.2){R.floor.push(rms);}
    else{const fl=R.floor.length?PT_med(R.floor):0,th=Math.max(0.01,fl*3);
      if(rms>th){R.speech++;R.sil=0;if(R.speech>=2)R.heard=true;}else if(R.heard)R.sil+=blk;
      if(R.heard&&R.sil>0.55){PT_stop();return;}}
    const bar=$('#ptBar');if(bar)bar.style.width=Math.min(100,R.t/3*100)+'%';
    if(R.t>=3)PT_stop();
  };
  PT.recording=true;PT.micMsg='';PT.status='Đang thu. Nói ngay bây giờ, máy tự dừng khi bạn im lặng.';PT_drawItem();
}
function PT_stop(){
  const R=PT_R;if(!R)return;PT_R=null;
  try{R.proc.onaudioprocess=null;R.src.disconnect();R.proc.disconnect();R.mute.disconnect();}catch(e){}
  R.stream.getTracks().forEach(t=>t.stop());PT.recording=false;
  const n=R.chunks.reduce((s,c)=>s+c.length,0);
  if(!n){PT.status='';PT_drawItem();return;}
  const buf=PT_ctx().createBuffer(1,n,R.sr),d=buf.getChannelData(0);let o=0;for(const c of R.chunks){d.set(c,o);o+=c.length;}
  PT_finish(buf,R.heard);
}
function PT_finish(buf,heard){
  if(!PT.item)return;
  PT.recBuf=buf;const an=PT_analyze(buf,PT.item.t.length);
  if(an.voiced<6){PT.rec=null;PT.fb=null;PT.status=heard?'Chưa bắt được cao độ của giọng. Nói to, rõ và kéo dài âm hơn một chút.':'Chưa nghe thấy giọng. Kiểm tra micro rồi nói to hơn.';}
  else{PT.rec=an;PT.fb=PT_feedback();PT.status='';window.__award&&window.__award('speak',1);}
  PT_drawItem();PT_drawChart();PT_drawFb();
}
function PT_playBuf(buf){const ctx=PT_ctx();if(!ctx||!buf)return;stopSay();ctx.resume&&ctx.resume();const s=ctx.createBufferSource();s.buffer=buf;s.connect(ctx.destination);s.start();}
async function PT_playRef(){const it=PT.item;if(!it)return;
  if(it.kind==='s'){if(!(await saySyl(it.key)))say(it.h||it.py[0]);}else sayWord(it.h);}

/* ---------- drawing ---------- */
function PT_chartSVG(){
  const it=PT.item;if(!it)return '';
  const n=it.t.length,VW=480,VH=230,l=34,r=8,t=10,b=34,pw=VW-l-r,ph=VH-t-b,sw=pw/n;
  const Y=v=>t+(PT_YMAX-Math.max(-PT_YMAX-0.5,Math.min(PT_YMAX+0.5,v)))/(2*PT_YMAX)*ph;
  let g='';
  for(let v=-8;v<=8;v+=2){const y=Y(v).toFixed(1);g+=`<line x1="${l}" x2="${VW-r}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="${v===0?1.2:0.6}" ${v%4?'stroke-dasharray="2 4"':''}/>`;if(v%4===0)g+=`<text x="${l-6}" y="${(+y+4).toFixed(1)}" text-anchor="end" font-size="13" fill="var(--muted)">${v>0?'+'+v:v}</text>`;}
  for(let i=0;i<n;i++){const x=l+sw*(i+0.5);if(i>0)g+=`<line x1="${l+sw*i}" x2="${l+sw*i}" y1="${t}" y2="${t+ph}" stroke="var(--line2)" stroke-dasharray="4 4"/>`;
    g+=`<text x="${x}" y="${VH-12}" text-anchor="middle" font-size="17" font-weight="600" fill="var(--t${it.t[i]})" font-family="var(--f-py)">${esc(it.py[i])}</text>`;}
  const id=PT_ideal(it);
  const idealD=id.segs.map((s,i)=>'M'+s.map((v,k)=>`${(l+sw*i+6+(sw-12)*k/(PT_K-1)).toFixed(1)} ${Y(v).toFixed(1)}`).join(' L')).join(' ');
  g+=`<path d="${idealD}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="6 5" opacity=".75" stroke-linecap="round"/>`;
  const line=(an,col,w)=>{const al=PT_align(an,n);if(!al)return '';let d='';
    an.segs.slice(0,n).forEach(([a,bb],i)=>{let pen=false;for(let j=a;j<=bb;j++){const v=an.st[j];if(v==null){pen=false;continue;}const x=l+sw*i+6+(sw-12)*(bb>a?(j-a)/(bb-a):0.5);d+=(pen?' L':' M')+x.toFixed(1)+' '+Y(v+al.off).toFixed(1);pen=true;}});
    return d?`<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`:'';};
  g+=line(PT.ref,'var(--accent)',3.5)+line(PT.rec,'var(--t4)',3);
  return `<svg viewBox="0 0 ${VW} ${VH}" role="img" aria-label="Biểu đồ cao độ: bản mẫu, giọng của bạn và dạng thanh chuẩn">${g}</svg>`;
}
function PT_drawChart(){
  const c=$('#ptChart');if(!c)return;
  if(!PT.item){c.innerHTML='<div class="empty">Chọn một âm tiết hoặc một từ để bắt đầu.</div>';return;}
  c.innerHTML=`${PT_chartSVG()}<div class="pt-legend"><span><i class="pt-k pt-kr"></i>Bản mẫu</span><span><i class="pt-k pt-km"></i>Giọng của bạn</span><span><i class="pt-k pt-ki"></i>Dạng thanh chuẩn</span></div>
   <p class="note">Trục dọc là nửa cung so với giọng trung bình của người nói, nên giọng nam và nữ so được với nhau. Mỗi âm tiết kéo giãn cùng một độ rộng.${PT.refNote?' '+esc(PT.refNote):''}</p>`;
}
function PT_drawFb(){

async function PT_search(){
  const r=$('#ptRes');if(!r)return;const q=PT.q.trim();
  if(!q){r.innerHTML='<span class="note">Từ 1 đến 2 âm tiết, có bản ghi âm gốc.</span>';return;}
  const pool=await PT_pool(),han=[...q].some(isHan),qq=stripTone(q).replace(/[\s'0-9]/g,''),qv=viFold(q).trim();

window.__xpFly=n=>{
  setTimeout(uiChips,0); if(!n)return;
  const chip=[$('#xpChip')].find(x=>x&&x.offsetParent); if(!chip)return;
  const to=chip.getBoundingClientRect(), from=UI_PT||{x:innerWidth/2,y:innerHeight/2};
  const f=document.createElement('div');f.className='xpfly';f.textContent='+'+n+' XP';document.body.appendChild(f);

function confetti({count=100,duration=1500}={}){
  if(uiReduced())return;
  const cv=document.createElement('canvas'),dpr=devicePixelRatio||1;cv.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:90;width:100%;height:100%';
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;document.body.appendChild(cv);const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  const css=getComputedStyle(document.documentElement);const cols=['--t1','--t2','--t3','--t4','--xp'].map(v=>css.getPropertyValue(v).trim()||'#FFD25A');
  const ps=Array.from({length:count},()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.35,vx:(Math.random()-.5)*13,vy:-Math.random()*13-4,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,h:4+Math.random()*4,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(t){const k=(t-t0)/duration;ctx.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.globalAlpha=Math.max(0,1-k);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
    if(k<1)requestAnimationFrame(f);else cv.remove();})(t0);
}

  else{P=Object.assign(structuredClone(DEFAULT),saved||{});P.settings=Object.assign({},DEFAULT.settings,P.settings||{});}

  $('#pfGo',m.el).onclick=async()=>{const n=$('#pfN',m.el).value.trim(),p=$('#pfP',m.el).value.trim();if(!slugOf(n)){toast('Nhập tên trước nhé.');return;}if(p&&p.length<4){toast('PIN cần 4 đến 6 số.');return;}m.close();await setProfile(n,p);toast('Chào '+n+'!');};
}

/* ---------- Bạn học view ---------- */
let BOARD=null, BOARD_AT=0;
async function boardLoad(force){
  if(!WEB||!WEB.sync||!getKey())return null;
  if(!force&&BOARD&&Date.now()-BOARD_AT<60000)return BOARD;
  try{const j=await api('api/board',{method:'GET'});BOARD=(j.list||[]);BOARD_AT=Date.now();}catch(e){return BOARD;}
  return BOARD;
}
function boardRows(list){
  const mon=uiMonday();
  return list.map(x=>Object.assign({},x,{wxp:x.week===mon?x.wxp:0,today:x.week===mon&&ymd(x.upd||0)===ymd(Date.now())?x.today:0}))
    .sort((a,b)=>b.wxp-a.wxp||b.streak-a.streak);
}
VIEWS.friends=async el=>{
  const link=location.origin&&location.protocol.startsWith('http')&&!IN_ARTIFACT?location.origin:'https://hanyu-ecru.vercel.app';
  const invite=`<div class="panel"><h3>Mời người thân cùng học</h3>
    <ol class="inv"><li>Gửi link <b>${esc(link.replace(/^https?:\/\//,''))}</b> và mật khẩu nhóm (mật khẩu bạn đang dùng để mở trợ lý AI).</li><li>Họ mở link, Tiểu Long hỏi tên, họ đặt một mã PIN riêng.</li><li>Nhập mật khẩu nhóm một lần là có đồng bộ, trợ lý AI và có mặt trên bảng này.</li></ol>
    <div class="row"><button class="btn sm" id="frCopy">${ic('repeat')} Sao chép lời mời</button><button class="btn ghost sm" id="frSw">Đổi người học trên máy này</button></div></div>`;
  if(IN_ARTIFACT||!WEB||!WEB.sync){
    el.innerHTML=`<div class="view">${mcSay('idea','Bảng bạn học chạy trên bản web. Mở Stalong trên web để học cùng nhau nhé.',64)}${invite}</div>`;bindInv();return;}
  if(!getKey()){el.innerHTML=`<div class="view">${mcSay('hi','Nhập mật khẩu nhóm để xem cả nhóm đang học thế nào.',64)}<button class="btn primary" id="frKey" style="align-self:flex-start">Nhập mật khẩu nhóm</button>${invite}</div>`;
    $('#frKey').onclick=async()=>{if(await askPassword(false)){await initPlatform();VIEWS.friends(el);}};bindInv();return;}
  el.innerHTML='<div class="view"><p class="note">Đang tải bảng...</p></div>';
  const list=boardRows((await boardLoad(true))||[]);
  const me=WHO?WHO.slug:'';
  el.innerHTML=`<div class="view">
    <div class="spread"><h2>Tuần này</h2><span class="note">Xếp theo XP từ thứ Hai</span></div>
    ${list.length?`<div class="board">${list.map((x,i)=>`<div class="bd-row ${x.slug===me?'me':''}"><span class="bd-pos num">${i+1}</span><span class="bd-mc">${mascotSVG(x.today?'hi':'zzz',48,x.rank||0)}</span>
      <span class="bd-n"><b>${esc(x.name)}${x.slug===me?' <span class="pill ai">bạn</span>':''}</b><span class="small muted">${PL_RANKS[x.rank||0][2]} <span class="han">${PL_RANKS[x.rank||0][1]}</span>, ${x.known||0} từ đã thuộc</span></span>
      <span class="bd-st"><span class="bd-x num">${ic('zap')}${x.wxp}</span><span class="bd-f num ${x.streak?'':'cold'}">${ic('flame')}${x.streak}</span></span></div>`).join('')}</div>`
      :mcSay('zzz','Chưa ai lên bảng. Học xong một bài là tên bạn sẽ hiện ở đây.',64)}
    ${list.length===1?mcSay('idea','Một mình thì hơi buồn. Rủ thêm người cùng học cho vui nhé.',56):''}
    ${invite}</div>`;
  bindInv();
  function bindInv(){
    const c=$('#frCopy');if(c)c.onclick=()=>{const t=`Học tiếng Trung cùng mình trên Stalong 思龙 nhé: ${link}\nMở link, nhập tên và đặt mã PIN riêng. Mật khẩu nhóm mình gửi riêng.`;
      (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Đã sao chép lời mời.')).catch(()=>toast(t,6000));};
    const s=$('#frSw');if(s)s.onclick=switchProfile;
  }
};
/* small board card on Today */
async function uiFriendsCard(){
  const side=$('.hm-side');if(!side)return;
  const list=await boardLoad(false);if(!list||list.length<2||current!=='home')return;
  const rows=boardRows(list).slice(0,3),me=WHO?WHO.slug:'';
  if(!side.isConnected||$('#hmFr'))return;
  side.insertAdjacentHTML('beforeend',`<button class="panel fr-mini" id="hmFr"><span class="label">Bạn học tuần này</span>${rows.map((x,i)=>`<span class="fr-r ${x.slug===me?'me':''}"><span class="num">${i+1}</span><span class="fr-mc">${mascotSVG('calm',30,x.rank||0)}</span><b>${esc(x.name)}</b><span class="num muted">${x.wxp} XP</span></span>`).join('')}</button>`);
  const fr=$('#hmFr',side);if(fr)fr.onclick=()=>go('friends');
}

/* Today: remind to turn on sync when this device has no group password yet */
function uiSyncBanner(){
  if(!WEB||!WEB.sync||getKey()||current!=='home'||$('#syBan'))return;
  const v=$('#view .view');if(!v)return;
  v.insertAdjacentHTML('afterbegin',`<div class="vbanner" id="syBan">${mcSay('idea','Máy này chưa đồng bộ, tiến độ chỉ lưu tại đây. Nhập mật khẩu nhóm để mở tiến độ của bạn từ máy khác.',48)}<div class="row"><button class="btn primary sm" id="syGo">Nhập mật khẩu nhóm</button></div></div>`);
  $('#syGo').onclick=async()=>{if(await askPassword(false)){await initPlatform();route();toast(syncState==='on'?'Đã đồng bộ.':'Chưa đồng bộ được, thử lại sau.');}};
}

/* ================= boot ================= */
async function boot(){
  uiInit();
  applySettings();
  const h=(location.hash||'').slice(1); if(VIEWS[h])current=h;
  $('#view').innerHTML='<div class="view"><p class="note">Đang tải từ vựng...</p></div>';
  await loadLevel(Math.min(...P.settings.lv));
  route();
  initPlatform();
  await loadAllWords();
  for(const L of [8,9])try{await loadLevel(L);}catch(e){}
  if(['home','dict','study','progress'].includes(current)&&!$('.modal-bg'))route(true);
  setTimeout(()=>{if(!$('.modal-bg'))uiIntro();},700);
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-phw]');if(b){e.preventDefault();e.stopPropagation();const o=$('.modal-bg');if(o)o.remove();openWord(b.dataset.phw);}},true);
if(!IN_ARTIFACT&&'serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}
boot().catch(e=>{console.error(e);$('#view').innerHTML='<div class="empty">Không tải được dữ liệu. Tải lại trang thử xem.</div>';});
})();
